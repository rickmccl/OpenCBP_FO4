;=============================================================================;
; Bone Physics Parameters
; These values control per‑bone physics behavior. Setting some of them to 0
; can break the simulation or cause unstable motion.
;=============================================================================;
; stiffness          | Linear spring stiffness. Higher values = less movement.
; stiffness2         | Quadratic spring stiffness. Higher values = less movement.
; damping            | Damping factor applied to motion each tick.
;                    |   Higher values = stronger resistance to motion,
; maxOffsetX/Y/Z     | Maximum positional displacement allowed on each axis.
;                    |   When reached, motion is clamped. gravityCorrection does
;                    |   not apply once the bone hits its offset limit.
; linearX/Y/Z        | Linear motion scaling along each axis:
;                    |   X = side‑to‑side
;                    |   Y = forward/back
;                    |   Z = up/down
; rotationalX/Y/Z    | Rotational motion scaling around each axis:
;                    |   X rotation around the Y axis; left to right "barrel roll" swing
;                    |   Y rotation around the Z axis; left to right door swing
;                    |   Z rotation around the X axis; down and up "flip" Swing
; rotateLinearX/Y/Z  | Rotates the *linear* motion vector around each axis.
; rotateRotationX/Y/Z| Rotates the *rotational* motion vector around each axis.
; absRotX            | (Boolean) If nonzero, rotationalX uses the absolute value of motion
;                    |   instead of signed motion.
; timetick           | Number of physics sub‑steps per frame.
;                    |   Example: timetick=4 on a 16ms frame → 4 steps of 4ms.
;                    |   Minimum value is 1.
; timeStep           | Delta‑time used inside the solver. Controls the coupling
;                    |   between spring force and momentum. Defaults to 0.016
;                    |   if not specified. Must be > 0.
; gravityBias        | Downward force multiplier (per bone). Controls sag.
; gravityCorrection  | Upward correction applied to counteract gravityBias.
;                    |   Use this to keep bones near their modeled neutral pose.
; cogOffsetX/Y/Z     | Offset of the bone’s center of gravity relative to its
;                    |   root. Changes how rotation affects motion. Units are
;                    |   engine‑native and not physically intuitive.
;=============================================================================;

