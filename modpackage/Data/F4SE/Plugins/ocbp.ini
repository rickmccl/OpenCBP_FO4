[General]

; ------------------------------------------------------------
; Actor selection — which actors receive physics simulation
; ------------------------------------------------------------
; Only apply physics to the player (1 = enabled, 0 = disabled)
playerOnly=0

; Only apply physics to NPCs (1 = enabled, 0 = disabled)
npcOnly=0

; Apply physics to female actors
femaleOnly=1

; Apply physics to male actors
maleOnly=0


; ------------------------------------------------------------
; Simulation disabling rules
; ------------------------------------------------------------
; Disable physics when torso armor is equipped (1 = enabled)
detectArmor=0

; Comma-separated list of armor keywords to ignore when detectArmor=1
armorIgnore=

; ------------------------------------------------------------
; Performance Management System
; ------------------------------------------------------------
; Controls to dynamically limit the number of actors being animated with physics, 
; to maintain performance in crowded areas or on lower-end systems.

; Distance-based activation:
; Controls when CBP physics are active based on distance from the player.
; Smaller values = better performance. Larger values = physics active farther away.
; Physics STARTS when an NPC is closer than this distance.
physic_distance_enable=7500.0

; Physics STOPS when an NPC is farther than this distance.
; This value MUST be greater than physic_distance_enable to avoid stutter or flicker.
physic_distance_disable=8500.0

; Maximum number of NPCs that can have active physics at once.
max_active_actors=20

; adaptive actor limiting
; The system monitors your current FPS and compares it to targetFPS.
; If FPS drops below targetFPS, the number of active physics actors
; will be reduced to maintain performance. When FPS is above target,
; actors are gradually re-enabled (up to max_active_actors).
autoMode=1

; Target framerate the adaptive system tries to maintain 
; (physics framerate, not graphics framerate)
; Default is 60. Higher values make the limiter more aggressive.
; Max actor list will be gradually reduced or increased if this target is not met. 
targetFPS=60

; Actor exemption rules for adaptive limiting:
; Exempt actors will not be removed from the tracking list by automode.
; 0 = No exemptions (all actors can be disabled)
; 1 = Player is always exempt
; 2 = Player + essential NPCs are exempt
; 3 = Essential NPCs only are exempt
autoExceptions=1

; autowhitelist
; When enabled, actors will be tracked only if they have animatable bones.
autoWhitelist=1

; Use a whitelist instead of normal filtering (1 = enabled)
useWhitelist=0

; ------------------------------------------------------------
; The Whitelist section can be used to build a list of exactly which races, which bones.
;[Whitelist]


[Logging]
; ------------------------------------------------------------
; Logging controls
; ------------------------------------------------------------
; Consolidate repeated log messages to reduce spam
logConsolidationEnabled=true

; Enable or disable logging (almost) entirely
loggingEnabled=false

; Debug level logging, for when you are editing simulation or bone processing code
debugLogging=false



